    <style>
        body {
            display: grid;
            grid-template-areas:
                "header"
                "main"
                "footer";
            grid-template-rows: auto 1fr auto;
            min-height: 100svh;

            >header {
                grid-area: header;
                padding: var(--space-2) var(--space-3);
                border-block-end: var(--border);
                background: var(--panel);
            }

            >main {
                grid-area: main;
                padding: var(--space-3);
            }

            >footer {
                grid-area: footer;
                padding: var(--space-2) var(--space-3);
                border-block-start: var(--border);
                background: var(--panel);
            }
        }
    </style>
</head>
